name: Build and release Windows scanner

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Prepare release metadata
        shell: pwsh
        run: |
          $cmake = Get-Content CMakeLists.txt -Raw
          $versionMatch = [regex]::Match(
            $cmake,
            'project\(\s*ShaiHulud2Scanner\s+VERSION\s+([0-9]+\.[0-9]+\.[0-9]+)'
          )

          if (-not $versionMatch.Success) {
            throw "Unable to read the application version from CMakeLists.txt."
          }

          $version = $versionMatch.Groups[1].Value
          $tag = "v$version-build.$env:GITHUB_RUN_NUMBER"
          $title = "Shai-Hulud 2.0 Scanner v$version - Build $env:GITHUB_RUN_NUMBER"
          $archive = "ShaiHulud2Scanner-Windows-x64-$tag.zip"
          $checksum = "$archive.sha256"

          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_TITLE=$title" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_ARCHIVE=$archive" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_CHECKSUM=$checksum" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "Release tag: $tag"

      - name: Prepare pinned Dear ImGui once
        shell: pwsh
        run: ./tools/prepare_imgui.ps1 -ProjectRoot $env:GITHUB_WORKSPACE -Tag v1.92.9b

      - name: Verify embedded data and scanner invariants
        run: python tools/verify_project.py

      - name: Configure without build-time downloads
        shell: pwsh
        run: >-
          cmake --fresh -S . -B build -G "Visual Studio 17 2022" -A x64
          "-DSHAIHULUD_IMGUI_SOURCE_DIR:PATH=$env:GITHUB_WORKSPACE/third_party/imgui-1.92.9b"
          "-DCMAKE_SUPPRESS_REGENERATION:BOOL=ON"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run parser regression tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Assemble portable folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/Release/ShaiHulud2Scanner.exe dist/
          Copy-Item build/Release/data dist/data -Recurse
          Copy-Item build/Release/malicious_hashes.json dist/

          if (Test-Path build/Release/Dear-ImGui-LICENSE.txt) {
            Copy-Item build/Release/Dear-ImGui-LICENSE.txt dist/
          }

      - name: Package release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          $archivePath = Join-Path release $env:RELEASE_ARCHIVE
          $checksumPath = Join-Path release $env:RELEASE_CHECKSUM

          Compress-Archive -Path dist/* -DestinationPath $archivePath -CompressionLevel Optimal -Force

          $hash = (Get-FileHash -Path $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash *$env:RELEASE_ARCHIVE" | Set-Content -Path $checksumPath -Encoding ascii

          Write-Host "Created $archivePath"
          Write-Host "SHA-256: $hash"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: ShaiHulud2Scanner-Windows-x64-${{ github.run_number }}
          path: release/*
          if-no-files-found: error

      - name: Publish a new GitHub release for this update
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:RELEASE_TAG" `
            "release/$env:RELEASE_ARCHIVE#Windows x64 portable ZIP" `
            "release/$env:RELEASE_CHECKSUM#SHA-256 checksum" `
            --repo "${{ github.repository }}" `
            --target "${{ github.sha }}" `
            --title "$env:RELEASE_TITLE" `
            --generate-notes `
            --latest
